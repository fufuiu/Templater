let value = await tp.system.prompt("Please enter a value");
%>
# <% value %>
selected value: <% value %>"""

[tp.system.functions.suggester]
name = "suggester"
description = "打开选择窗口并返回用户选择的项。"
definition = "tp.system.suggester(text_items: string[] | ((item: T) => string), items: T[], throw_on_cancel: boolean = false, placeholder: string = \"\", limit?: number = undefined, default_value?: T = undefined)"

[[tp.system.functions.suggester.args]]
name = "text_items"
description = "每个选项的显示文本组成的字符串数组，也可以是将选项转换为显示文本的函数。"

[[tp.system.functions.suggester.args]]
name = "items"
description = "按对应顺序排列的各选项实际值组成的数组。"

[[tp.system.functions.suggester.args]]
name = "throw_on_cancel"
description = "取消窗口时抛出错误，而不是返回 `null`。"

[[tp.system.functions.suggester.args]]
name = "placeholder"
description = "输入框的占位提示文本。"

[[tp.system.functions.suggester.args]]
name = "limit"
description = "限制同时显示的选项数量，可提高大型列表的显示性能。"

[[tp.system.functions.suggester.args]]
name = "default_value"
description = "选择窗口的默认选项。"

[[tp.system.functions.suggester.examples]]
name = "Suggester"
example = """<% await tp.system.suggester(["Happy", "Sad", "Confused"], ["Happy", "Sad", "Confused"]) %>"""

[[tp.system.functions.suggester.examples]]
name = "Suggester with mapping function (same as above example)"
example = """<% await tp.system.suggester((item) => item, ["Happy", "Sad", "Confused"]) %>"""

[[tp.system.functions.suggester.examples]]
name = "Suggester for files"
example = """[[<% (await tp.system.suggester((item) => item.basename, tp.app.vault.getMarkdownFiles())).basename %>]]"""

[[tp.system.functions.suggester.examples]]
name = "Suggester for tags"
example = """<% await tp.system.suggester(item => item, Object.keys(tp.app.metadataCache.getTags()).map(x => x.replace("#", ""))) %>"""

[[tp.system.functions.suggester.examples]]
name = "Reuse value from suggester"
example = """<%*
let selectedValue = await tp.system.suggester(["Happy", "Sad", "Confused"], ["Happy", "Sad", "Confused"]);
%>
# <% selectedValue %>
selected value: <% selectedValue %>"""

[[tp.system.functions.suggester.examples]]
name = "Default value for the suggester"
example = """<%*
let selectedValue = await tp.system.suggester(["Happy", "Sad", "Confused"], ["Happy", "Sad", "Confused"], false, "", undefined, "Confused");
%>
# <% selectedValue %>
selected value: <% selectedValue %>"""

[tp.system.functions.multi_suggester]
name = "multi_suggester"
description = "打开支持多选的选择窗口，返回用户选择的项组成的数组。"
definition = "tp.system.multi_suggester(text_items: string[] | ((item: T) => string), items: T[], throw_on_cancel: boolean = false, title: string = \"\", limit?: number = undefined, default_values?: T[] = undefined)"

[[tp.system.functions.multi_suggester.args]]
name = "text_items"
description = "每个选项的显示文本组成的字符串数组，也可以是将选项转换为显示文本的函数。"

[[tp.system.functions.multi_suggester.args]]
name = "items"
description = "按对应顺序排列的各选项实际值组成的数组。"

[[tp.system.functions.multi_suggester.args]]
name = "throw_on_cancel"
description = "取消窗口时抛出错误，而不是返回 `null`。"

[[tp.system.functions.multi_suggester.args]]
name = "title"
description = "显示在窗口顶部的文本。"

[[tp.system.functions.multi_suggester.args]]
name = "limit"
description = "限制同时显示的选项数量，可提高大型列表的显示性能。"

[[tp.system.functions.multi_suggester.args]]
name = "default_values"
description = "选择窗口中默认选中的项。"

[[tp.system.functions.multi_suggester.examples]]
name = "Multi-suggester"
example = """<% await tp.system.multi_suggester(["Happy", "Sad", "Confused"], ["Happy", "Sad", "Confused"]) %>"""

[[tp.system.functions.multi_suggester.examples]]
name = "Multi-suggester with mapping function (same as above example)"
example = """<% await tp.system.multi_suggester((item) => item, ["Happy", "Sad", "Confused"]) %>"""

[[tp.system.functions.multi_suggester.examples]]
name = "Multi-suggester for files"
example = """<% (await tp.system.multi_suggester((item) => item.basename, tp.app.vault.getMarkdownFiles())).map(f => `[[${f.basename}]]`) %>"""

[[tp.system.functions.multi_suggester.examples]]
name = "Multi-suggester for tags"
example = """<% await tp.system.multi_suggester(item => item, Object.keys(tp.app.metadataCache.getTags()).map(x => x.replace("#", ""))) %>"""

[[tp.system.functions.multi_suggester.examples]]
name = "Reuse value from multi-suggester"
example = """<%*
let selectedValues = await tp.system.multi_suggester(["Happy", "Sad", "Confused"], ["Happy", "Sad", "Confused"]);
%>
# <% selectedValues %>
selected values: <% selectedValues %>"""

[[tp.system.functions.multi_suggester.examples]]
name = "Default value for the suggester"
example = """<%*
let selectedValue = await tp.system.multi_suggester(["Happy", "Sad", "Confused"], ["Happy", "Sad", "Confused"], false, "", undefined, ["Happy", "Confused"]);
%>
# <% selectedValue %>
selected value: <% selectedValue %>"""

[tp.web]
name = "web"
description = "此模块包含所有与网络相关的内置函数（用于发起网络请求）。"

[tp.web.functions.daily_quote]
name = "daily_quote"
description = "获取每日引言并生成标注块。不传参数时使用 Obsidian 的界面语言（通过 `getLanguage()` 获取）；不支持该语言时回退到英语。英语引言来自 `https://github.com/Zachatoo/quotes-database`，西班牙语引言来自 `https://github.com/wulflo/frases-inventario`。"
definition = "tp.web.daily_quote(language?: string)"

[[tp.web.functions.daily_quote.args]]
name = "language"
description = "可选的语言代码（例如 `\"en\"`、`\"es\"`），用于选择引言数据库。默认使用 Obsidian 的界面语言；没有对应数据库时回退到英语。"

[[tp.web.functions.daily_quote.examples]]
name = "Daily quote"
example = "<% await tp.web.daily_quote() %>"

[[tp.web.functions.daily_quote.examples]]
name = "Daily quote in Spanish"
example = """<% await tp.web.daily_quote("es") %>"""

[tp.web.functions.random_picture]
name = "random_picture"
description = "从 `https://unsplash.com/` 获取随机图片。"
definition = "tp.web.random_picture(size?: string, query?: string, include_size?: boolean)"

[[tp.web.functions.random_picture.args]]
name = "size"
description = "图片尺寸，格式为 `<width>x<height>`。"

[[tp.web.functions.random_picture.args]]
name = "query"
description = "只选择符合搜索词的图片，多个搜索词使用逗号分隔。"

[[tp.web.functions.random_picture.args]]
name = "include_size"
description = "是否在图片的 Markdown 链接中包含指定尺寸，默认为 false。"

[[tp.web.functions.random_picture.examples]]
name = "Random picture"
example = "<% await tp.web.random_picture() %>"

[[tp.web.functions.random_picture.examples]]
name = "Random picture with size"
example = """<% await tp.web.random_picture("200x200") %>"""

[[tp.web.functions.random_picture.examples]]
name = "Random picture with size and query"
example = """<% await tp.web.random_picture("200x200", "landscape,water") %>"""

[tp.web.functions.request]
name = "request"
description = "向指定 URL 发起 HTTP 请求。可选择指定路径，从响应中提取特定数据。"
definition = "tp.web.request(url: string, path?: string)"

[[tp.web.functions.request.args]]
name = "url"
description = "HTTP 请求的目标 URL。"

[[tp.web.functions.request.args]]
name = "path"
description = "用于从 JSON 响应中提取特定数据的路径。"

[[tp.web.functions.request.examples]]
name = "Simple request"
example = """<% await tp.web.request("https://jsonplaceholder.typicode.com/todos/1") %>"""

[[tp.web.functions.request.examples]]
name = "Request with path"
example = """<% await tp.web.request("https://jsonplaceholder.typicode.com/todos", "0.title") %>"""


